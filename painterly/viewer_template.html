<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an easel on the left (the canvas, its stroke path, the scrubber and a filmstrip),
   the margin notes for the current stroke on the right; stacked on narrow screens. */
:root {
  --wall: #e4e7ec;      /* studio wall, cool grey with a blue bias */
  --panel: #f6f7f9;
  --ink: #1a1e26;
  --muted: #5a6271;
  --line: #c7ccd5;
  --accent: #2b44c4;    /* ultramarine */
  --accent-soft: #dfe4fb;
  --refused: #a4402a;
  --refused-soft: #f6e3dd;
  --shadow: 0 1px 2px rgb(20 24 32 / .08), 0 8px 24px rgb(20 24 32 / .10);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #13161b; --panel: #1b1f26; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2d333e;
    --accent: #93a3ff; --accent-soft: #252c4d; --refused: #ff9b80; --refused-soft: #3a2420;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #13161b; --panel: #1b1f26; --ink: #e6e9ef; --muted: #9aa3b3; --line: #2d333e;
  --accent: #93a3ff; --accent-soft: #252c4d; --refused: #ff9b80; --refused-soft: #3a2420;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--wall); color: var(--ink); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }

header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 4.2vw, 44px)/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1.untitled { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13.5px; }
.meta b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.easel { display: grid; gap: 12px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
@media (max-width: 860px) { .easel { position: static; } }
.canvas-box { position: relative; background: var(--panel); box-shadow: var(--shadow); line-height: 0; }
.canvas-box img { width: 100%; height: auto; display: block; }
.canvas-box svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.path-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 6; vector-effect: non-scaling-stroke; }
.path-halo { fill: none; stroke: rgb(255 255 255 / .75); stroke-width: 5.5; vector-effect: non-scaling-stroke; }
.path-dot { fill: var(--accent); stroke: #fff; stroke-width: 2; vector-effect: non-scaling-stroke; }

.controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
button {
  font: 500 14px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 13px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 13.5px; color: var(--muted); }
.under strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
label.toggle { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.hint { font-family: var(--mono); font-size: 12px; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.strip button { padding: 0; border-radius: 3px; border: 2px solid transparent; flex: 0 0 auto; line-height: 0; background: none; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip img { width: 54px; height: auto; display: block; border-radius: 1px; }

.notes { background: var(--panel); box-shadow: var(--shadow); border-radius: 4px; padding: 22px 22px 26px; display: grid; gap: 16px; min-width: 0; }
.step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.step-head h2 { font: 700 24px/1.1 var(--display); margin: 0; }
.chip { font: 500 12.5px/1 var(--mono); padding: 5px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; vertical-align: -3px; }

.note { display: grid; gap: 5px; min-width: 0; }
.note .label { font: 500 11.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.note.thinking p { margin: 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; white-space: pre-wrap; }
.note.text p { margin: 0; white-space: pre-wrap; font-size: 16px; }
.note.refused { background: var(--refused-soft); border-radius: 4px; padding: 10px 12px; }
.note.refused .label { color: var(--refused); }
.note.refused p { margin: 0; }
.note.critique { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; gap: 8px; }
.note.critique .asked { margin: 0; font-size: 14px; }
.note.critique .reply { margin: 0; white-space: pre-wrap; font-size: 14.5px; padding-left: 12px; border-left: 2px solid var(--accent); }
.note.system p, .note.look p { margin: 0; color: var(--muted); font-size: 14px; }
.none { color: var(--muted); font-size: 14px; margin: 0; }

dl.spec { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: 14px; }
dl.spec dt { color: var(--muted); }
dl.spec dd { margin: 0; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pressure { display: grid; gap: 4px; }
.pressure svg { width: 100%; max-width: 280px; height: 56px; display: block; }
.pressure .area { fill: var(--accent-soft); }
.pressure .curve { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.pressure .base { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pressure .pt { fill: var(--accent); }

.finale { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.finale h3 { font: 700 22px/1.15 var(--display); margin: 0; text-wrap: balance; }
.finale p { margin: 0; font-size: 16px; max-width: 62ch; }

details.brief { background: var(--panel); border-radius: 4px; box-shadow: var(--shadow); padding: 14px 18px; }
details.brief summary { cursor: pointer; font-weight: 600; }
details.brief pre { white-space: pre-wrap; font: 13px/1.6 var(--mono); margin: 12px 0 0; max-width: 80ch; color: var(--ink); }
details.brief p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .canvas-box img { transition: opacity .12s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Painterly run</div>
    <h1 id="title">Untitled</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="stage">
    <div class="easel">
      <div class="canvas-box" id="canvasBox">
        <img id="frame" alt="The canvas after the selected stroke">
        <svg id="overlay" aria-hidden="true"></svg>
      </div>
      <div class="controls">
        <button id="prev" type="button" aria-label="Previous stroke">← Prev</button>
        <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Step through the strokes">
        <button id="next" type="button" aria-label="Next stroke">Next →</button>
      </div>
      <div class="under">
        <span id="position"></span>
        <label class="toggle"><input type="checkbox" id="showPath" checked> Show the brush's path</label>
        <span class="hint">← → to step</span>
      </div>
      <div class="strip" id="strip" aria-label="All steps"></div>
    </div>

    <section class="notes" id="notes" aria-live="polite"></section>
  </div>

  <details class="brief">
    <summary>What it was told</summary>
    <pre id="prompt"></pre>
    <p id="limits"></p>
    <div id="criticBrief" hidden><p><strong>What the critic was told</strong></p><pre id="criticPrompt"></pre></div>
  </details>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const M = D.meta, steps = D.steps;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strokeCount = steps.filter((s) => s.kind !== "start" && s.kind !== "end").length;

  // ---- header
  const t = $("title");
  if (M.title) t.textContent = M.title; else { t.textContent = "Untitled"; t.classList.add("untitled"); }
  const date = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(M.run || "");
  $("eyebrow").textContent = "Painterly run" + (date ? ` · ${date[1]}-${date[2]}-${date[3]} ${date[4]}:${date[5]}` : "");
  const meta = [
    ["Model", M.model], ["Effort", M.effort], ["Canvas", `${M.width} × ${M.height}`],
    ["Strokes", `${strokeCount}`],
    M.open_ended ? ["Mode", "open-ended, no finish"] : ["Ended", M.finished ? "it called finish" : "without finishing"],
  ];
  if (M.coverage != null) meta.push(["Covered", Math.round(M.coverage * 100) + "%"]);
  if (M.cost != null) meta.push(["Cost", "$" + Number(M.cost).toFixed(4)]);
  $("meta").innerHTML = meta.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");
  $("prompt").textContent = M.system_prompt || "";
  if (M.critic_prompt) { $("criticPrompt").textContent = M.critic_prompt; $("criticBrief").hidden = false; }
  $("limits").textContent =
    `Tools: brush${M.undo ? ", undo" : ""}, look${M.critic ? ", show (to a critic)" : ""}${M.open_ended ? "" : ", finish"}. One stroke per turn; ` +
    (M.max_stroke_length ? `the longest stroke ${M.max_stroke_length} px, ` : "no limit on stroke length, ") +
    `the widest brush ${M.max_brush_size} px, hand wobble ${M.wobble ? "on" : "off"}. ` +
    `A safety cap of ${M.max_actions} strokes${/up to \d+ strokes/.test(M.system_prompt || "") ? "" : ", which it wasn't told about"}.`;

  // ---- geometry (same arc as the engine, without the wobble)
  function arc(start, end, k) {
    const [ax, ay] = start, [bx, by] = end;
    const dx = bx - ax, dy = by - ay, c2 = Math.hypot(dx, dy);
    if (c2 < 1e-6) return { pts: [start], length: 0 };
    k = Math.max(-1, Math.min(1, k || 0));
    if (Math.abs(k) < 1e-4) return { pts: [start, end], length: c2 };
    const ex = dx / c2, ey = dy / c2, c = c2 / 2, sign = Math.sign(k);
    const nx = ey * sign, ny = -ex * sign, sag = Math.abs(k) * c;
    const R = (c * c + sag * sag) / (2 * sag), th = Math.atan2(c, R - sag);
    const cx = (ax + bx) / 2 - nx * (R - sag), cy = (ay + by) / 2 - ny * (R - sag);
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const p = -th + (2 * th * i) / 48;
      pts.push([cx + R * (Math.cos(p) * nx + Math.sin(p) * ex), cy + R * (Math.cos(p) * ny + Math.sin(p) * ey)]);
    }
    return { pts, length: 2 * R * th };
  }
  // The path through up to 7 points, as the engine draws it (Catmull-Rom when smooth).
  function nodePath(nodes, smooth, closed) {
    const P = nodes.map(([x, y]) => [x, y]);
    if (P.length === 1) return { pts: P, length: 0 };
    const seg = (p0, p1, p2, p3, out) => {
      for (let i = 1; i <= 16; i++) {
        const t = i / 16, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t
          + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    };
    let pts;
    if (closed && P.length >= 3) {
      if (smooth) {
        const ring = [P[P.length - 1], ...P, P[0], P[1]];
        pts = [P[0]];
        for (let i = 1; i < ring.length - 2; i++) seg(ring[i - 1], ring[i], ring[i + 1], ring[i + 2], pts);
      } else pts = [...P, P[0]];
    } else if (smooth && P.length >= 3) {
      const ext = [[2 * P[0][0] - P[1][0], 2 * P[0][1] - P[1][1]], ...P,
        [2 * P[P.length - 1][0] - P[P.length - 2][0], 2 * P[P.length - 1][1] - P[P.length - 2][1]]];
      pts = [P[0]];
      for (let i = 1; i < ext.length - 2; i++) seg(ext[i - 1], ext[i], ext[i + 1], ext[i + 2], pts);
    } else pts = P;
    let length = 0;
    for (let i = 1; i < pts.length; i++) length += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return { pts, length };
  }
  function strokePath(st) {
    if (Array.isArray(st.points)) return nodePath(st.points, st.smooth !== false, !!st.closed);
    if (st.start) return arc(st.start, st.end, st.curvature);  // runs from before multi-point strokes
    return { pts: [], length: 0 };
  }

  function pressureAt(ps, t) {
    if (ps.length === 1) return ps[0];
    const x = Math.min(Math.max(t, 0), 1) * (ps.length - 1);
    const i = Math.min(Math.floor(x), ps.length - 2);
    const f = 0.5 - 0.5 * Math.cos(Math.PI * (x - i));
    return ps[i] * (1 - f) + ps[i + 1] * f;
  }
  function pressureSvg(ps) {
    const W = 280, H = 56, pad = 4, n = 80;
    const ys = Array.from({ length: n + 1 }, (_, i) => pressureAt(ps, i / n));
    const X = (i) => (i / n) * W, Y = (v) => H - pad - v * (H - 2 * pad);
    const line = ys.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const dots = ps.map((v, i) => {
      const x = ps.length === 1 ? W / 2 : (i / (ps.length - 1)) * W;
      return `<circle class="pt" cx="${x.toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3"/>`;
    }).join("");
    return `<svg viewBox="-4 0 ${W + 8} ${H}" preserveAspectRatio="none" role="img" aria-label="Pressure from start to end: ${ps.join(", ")}">
      <line class="base" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>
      <polygon class="area" points="0,${Y(0)} ${line} ${W},${Y(0)}"/>
      <polyline class="curve" points="${line}"/>${dots}</svg>`;
  }

  // ---- strip
  const strip = $("strip");
  steps.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", labelFor(s, i));
    b.innerHTML = `<img alt="" src="${D.frames[s.frame] || ""}">`;
    b.addEventListener("click", () => go(i));
    strip.appendChild(b);
  });

  function labelFor(s, i) {
    if (s.kind === "start") return "Blank canvas";
    if (s.kind === "end") return M.finished ? "Finished" : "Where the session stopped";
    return `Stroke ${s.frame}`;
  }

  function notesHtml(notes) {
    return notes.map((n) => {
      if (n.type === "thinking") return `<div class="note thinking"><span class="label">Thinking (summary)</span><p>${esc(n.text)}</p></div>`;
      if (n.type === "text") return `<div class="note text"><span class="label">Said</span><p>${esc(n.text)}</p></div>`;
      if (n.type === "refused") {
        const inp = n.input || {};
        const where = Array.isArray(inp.points) ? `through ${esc(JSON.stringify(inp.points))}`
          : `from ${esc(JSON.stringify(inp.start))} to ${esc(JSON.stringify(inp.end))}`;
        const what = n.tool === "brush" ? `${esc(inp.brush ?? "?")} ${where}, size ${esc(inp.size)}` : esc(n.tool);
        return `<div class="note refused"><span class="label">Refused · nothing painted</span><p>${what}</p><p>${esc(n.error)}</p></div>`;
      }
      if (n.type === "critique") {
        const asked = n.message && n.message.trim()
          ? `<p class="asked">It showed the canvas and said: “${esc(n.message.trim())}”</p>`
          : `<p class="asked">It showed the canvas without a word.</p>`;
        return `<div class="note critique"><span class="label">Shown to the critic</span>${asked}
          <span class="label">The critic replied</span><p class="reply">${esc(n.text)}</p></div>`;
      }
      if (n.type === "look") {
        const i = n.input || {};
        return `<div class="note look"><span class="label">Looked closely</span><p>at ${esc(i.width)} × ${esc(i.height)} px from (${esc(i.x)}, ${esc(i.y)})</p></div>`;
      }
      return `<div class="note system"><span class="label">Note</span><p>${esc(n.text)}</p></div>`;
    }).join("");
  }

  function specHtml(st) {
    const a = strokePath(st);
    const rows = [["Brush", st.brush]];
    if (Array.isArray(st.points)) {
      rows.push(["Points", st.points.map((q) => `(${q})`).join(" → ")]);
      if (st.points.length > 1) rows.push(["Path", (st.smooth === false ? "straight, sharp corners" : "smooth curve") + (st.closed ? ", closed loop" : "")]);
    } else {
      rows.push(["From → to", `(${st.start}) → (${st.end})`], ["Curvature", (st.curvature ?? 0).toString()]);
    }
    rows.push(
      ["Length", a.length < 1 ? "a dab" : `${Math.round(a.length)} px along the path`],
      ["Size", `${st.size} px at full pressure`],
      ["Colour", `<span class="swatch" style="background:${esc(st.color)}"></span> ${esc(st.color)}`],
    );
    if (st.load != null) rows.push(["Load", st.load]);
    if (st.dilution != null) rows.push(["Dilution", st.dilution]);
    const dl = rows.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Colour" ? v : esc(v)}</dd>`).join("");
    const ps = Array.isArray(st.pressure) ? st.pressure : [1];
    return `<dl class="spec">${dl}</dl>
      <div class="pressure"><span class="note"><span class="label">Pressure, start → end</span></span>${pressureSvg(ps)}</div>`;
  }

  // ---- render one step
  const scrub = $("scrub");
  scrub.max = steps.length - 1;
  let cur = 0;

  function drawPath(s) {
    const svg = $("overlay");
    svg.setAttribute("viewBox", `0 0 ${M.width} ${M.height}`);
    const st = s.stroke;
    const { pts } = st ? strokePath(st) : { pts: [] };
    if (!$("showPath").checked || !pts.length) { svg.innerHTML = ""; return; }
    const p = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const [sx, sy] = pts[0], [ex, ey] = pts[pts.length - 1];
    const nodes = Array.isArray(st.points) && st.points.length > 2
      ? st.points.slice(1, st.closed ? undefined : -1).map(([x, y]) =>
          `<circle class="path-dot" cx="${x}" cy="${y}" r="${M.width / 260}" style="fill:var(--accent);opacity:.7"/>`).join("")
      : "";
    svg.innerHTML = pts.length > 1
      ? `<polyline class="path-halo" points="${p}"/><polyline class="path-line" points="${p}"/>
         <circle class="path-dot" cx="${sx}" cy="${sy}" r="${M.width / 110}"/>
         ${nodes}<circle class="path-dot" cx="${ex}" cy="${ey}" r="${M.width / 180}" style="fill:#fff;stroke:var(--accent)"/>`
      : `<circle class="path-dot" cx="${sx}" cy="${sy}" r="${M.width / 110}"/>`;
  }

  function go(i) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    const s = steps[cur];
    $("frame").src = D.frames[s.frame] || "";
    scrub.value = cur;
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === steps.length - 1;
    $("position").innerHTML = s.kind === "start" ? "<strong>Blank canvas</strong>"
      : s.kind === "end" ? `<strong>${M.finished ? "Finished" : M.open_ended ? "Still going" : "Stopped"}</strong> after ${strokeCount} strokes`
      : `<strong>Stroke ${s.frame}</strong> of ${strokeCount}`;
    [...strip.children].forEach((b, j) => b.setAttribute("aria-current", j === cur ? "true" : "false"));
    const thumb = strip.children[cur];  // keep it in view by scrolling the strip only, never the page
    if (thumb) {
      const l = thumb.offsetLeft - strip.offsetLeft, r = l + thumb.offsetWidth;
      if (l < strip.scrollLeft) strip.scrollLeft = l - 8;
      else if (r > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = r - strip.clientWidth + 8;
    }
    drawPath(s);

    let html = "";
    if (s.kind === "start") {
      html = `<div class="step-head"><h2>The canvas is ready</h2></div>
        <p class="none">${M.width} × ${M.height} px of bare paper. Step forward to see the first stroke and what led to it.</p>`;
    } else if (s.kind === "end") {
      const f = s.finish;
      html = `<div class="step-head"><h2>${f ? "Finished" : M.open_ended ? "Where the session stopped" : "Stopped"}</h2></div>` + notesHtml(s.notes);
      if (f && (f.title || f.note)) {
        html += `<div class="finale"><span class="note"><span class="label">Its title and note</span></span>
          ${f.title ? `<h3>${esc(f.title)}</h3>` : ""}${f.note ? `<p>${esc(f.note)}</p>` : ""}</div>`;
      } else if (f) {
        html += `<p class="none">It finished without a title or note.</p>`;
      } else if (M.open_ended) {
        html += `<p class="none">Open-ended: the model has no way to finish, and the painting can be continued.</p>`;
      } else if (!s.notes.length) {
        html += `<p class="none">The run ended before it called finish.</p>`;
      }
    } else {
      const st = s.stroke || {};
      const head = s.kind === "brush"
        ? `<h2>Stroke ${s.frame}</h2><span class="chip">${esc(st.brush)}</span>`
        : `<h2>${esc(s.kind)}</h2>`;
      html = `<div class="step-head">${head}</div>`;
      html += s.notes.length ? notesHtml(s.notes) : `<p class="none">No commentary before this stroke.</p>`;
      if (s.kind === "brush") html += specHtml(st);
    }
    $("notes").innerHTML = html;
  }

  $("prev").addEventListener("click", () => go(cur - 1));
  $("next").addEventListener("click", () => go(cur + 1));
  scrub.addEventListener("input", () => go(+scrub.value));
  $("showPath").addEventListener("change", () => drawPath(steps[cur]));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input[type=range]")) return;
    if (e.key === "ArrowRight") { go(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(steps.length - 1);
  });
  go(steps.length > 1 ? 1 : 0);
})();
</script>
